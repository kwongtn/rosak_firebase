# Firebase App Hosting config for the rewritten frontend.
# This file only configures the build/runtime — it does not itself create or deploy the App
# Hosting backend. See docs/frontend-map/00-overview.md for the wider rewrite context.
runConfig:
    minInstances: 0
    maxInstances: 4
    concurrency: 80
    cpu: 1
    memoryMiB: 512

env:
    - variable: BACKEND_URL
      value: https://api-community.mlptf.org.my/
      availability: [BUILD, RUNTIME]
    - variable: BACKEND_GRAPHQL_URL
      value: https://api-community.mlptf.org.my/graphql/
      availability: [BUILD, RUNTIME]
    # Firebase web app config: App Hosting can auto-populate this via the FIREBASE_WEBAPP_CONFIG
    # system variable instead of hardcoding values here — wiring that up is a fast-follow, not
    # done in this pass (see docs/frontend-map's shared-services-and-plumbing.md for the current
    # values baked into src/environments/environment.ts).
