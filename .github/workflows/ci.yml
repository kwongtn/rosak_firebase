name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

# A newer push to the same PR makes the older run's result moot, so stop it. Pushes to main and
# staging run to completion: their build job is the only one that uploads sourcemaps to Sentry.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npx prettier --check .

      # Skipped until a `lint` script exists in package.json.
      - run: npm run lint --if-present

      # Report-only for now: known advisories show up in the log without blocking a PR.
      - name: Audit production dependencies
        run: npm audit --omit=dev
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Angular build cache
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - run: npm ci

      # The build scripts' env parsing (scripts/*.test.mjs), with node's built-in runner.
      - name: Test build scripts
        run: node --test "scripts/*.test.mjs"

      # Regenerate gitignored codegen files (src/build-info.ts,
      # src/environments/*.generated.ts, public/favicon.*) that `ng test`
      # imports but `npm run build` normally produces via its `prebuild` hook.
      # Without this, the test build fails to resolve those modules.
      - run: npm run prebuild

      # Coverage is report-only (no threshold); the extra flags append to test:coverage's own.
      - run: npm run test:coverage -- --reporters=default --reporters=junit --output-file=test-results/junit.xml

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # functions/ is its own npm project (Node 20, per its engines) that the root jobs never touch.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test

      # Report-only, like the root lint job's audit.
      - name: Audit production dependencies
        run: npm audit --omit=dev
        continue-on-error: true

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Angular build cache
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - run: npm ci

      # The bundle bakes the backend URLs in at build time, so point them at the mock GraphQL
      # server the ssr-smoke job starts: its SSR render then needs no live backend. Sourcemaps are
      # uploaded to Sentry only for pushes, never for a pull request's throwaway merge commit.
      - name: Build
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q css-syntax-error build.log; then
            echo "::error::The build log contains css-syntax-error, so a generated CSS rule is invalid."
            exit 1
          fi
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          BACKEND_URL: http://localhost:4301/
          BACKEND_GRAPHQL_URL: http://localhost:4301/graphql/

      # Sourcemaps stay out (51 of the 64 MB): the smoke test does not read them.
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            dist/web
            !dist/web/**/*.map
          retention-days: 1
          if-no-files-found: error

  # Boots the built SSR server against the mock backend and probes the routes that server.ts owns.
  ssr-smoke:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/web

      - name: Smoke-test the SSR server
        run: |
          test -f dist/web/server/server.mjs
          node e2e/mock-graphql.server.mjs &
          NG_ALLOWED_HOSTS=localhost PORT=4000 node dist/web/server/server.mjs &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4000/about && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4000/about || { echo "SSR server did not start"; exit 1; }

          fail=0
          # check <path> <expected status> [response header that must be present]
          check() {
            local code
            code=$(curl -sS -o "$RUNNER_TEMP/body.txt" -D "$RUNNER_TEMP/headers.txt" -w '%{http_code}' --path-as-is "http://localhost:4000$1")
            echo "$1 -> $code"
            if [ "$code" != "$2" ]; then echo "FAIL $1: expected HTTP $2, got $code"; fail=1; fi
            if grep -q 'Error:' "$RUNNER_TEMP/body.txt"; then echo "FAIL $1: body contains 'Error:'"; fail=1; fi
            if [ -n "${3:-}" ] && ! grep -qi "^$3:" "$RUNNER_TEMP/headers.txt"; then echo "FAIL $1: no $3 header"; fail=1; fi
          }
          check / 200 cache-control
          check /about 200
          check /nope 404

          # Warning only: a malformed percent-encoding currently makes the SSR router throw and
          # answer 500 with the stack trace (F401). Make this a check once the server returns 400.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --path-as-is 'http://localhost:4000/%E0%A4%A')
          echo "/%E0%A4%A -> $code"
          if [ "$code" != 400 ]; then
            echo "::warning title=SSR smoke::/%E0%A4%A answered HTTP $code, expected 400 (F401)"
          fi

          exit $fail

  e2e:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Angular build cache
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - run: npm ci

      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
