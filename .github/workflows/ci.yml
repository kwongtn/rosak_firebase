name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

# A newer push to the same ref makes the older run's result moot, so stop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npx prettier --check .

      # Skipped until a `lint` script exists in package.json.
      - run: npm run lint --if-present

      # Report-only for now: known advisories show up in the log without blocking a PR.
      - name: Audit production dependencies
        run: npm audit --omit=dev
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Angular build cache
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - run: npm ci

      # The build scripts' env parsing (scripts/*.test.mjs), with node's built-in runner.
      - name: Test build scripts
        run: node --test "scripts/*.test.mjs"

      # Regenerate gitignored codegen files (src/build-info.ts,
      # src/environments/*.generated.ts, public/favicon.*) that `ng test`
      # imports but `npm run build` normally produces via its `prebuild` hook.
      # Without this, the test build fails to resolve those modules.
      - run: npm run prebuild

      # Coverage is report-only (no threshold); the extra flags append to test:coverage's own.
      - run: npm run test:coverage -- --reporters=default --reporters=junit --output-file=test-results/junit.xml

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # functions/ is its own npm project (Node 20, per its engines) that the root jobs never touch.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Angular build cache
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - run: npm ci

      - run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  e2e:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Angular build cache
        uses: actions/cache@v6
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-angular-

      - run: npm ci

      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
