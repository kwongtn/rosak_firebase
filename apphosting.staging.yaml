# Environment-specific override for backends whose "Environment name" (Console: backend →
# Settings → Environment) is set to "staging" — currently the "rosak-staging" backend. Merged
# over apphosting.yaml, taking priority; any variable not listed here (e.g. CAPTCHA_SITE_KEY,
# runConfig) falls back to the base file's value. See apphosting.yaml's own header comment and
# scripts/generate-runtime-config.mjs.
env:
  - variable: BACKEND_URL
    value: https://rosak-staging.kwongtn.xyz/
    availability: [BUILD, RUNTIME]
  - variable: BACKEND_GRAPHQL_URL
    value: https://rosak-staging.kwongtn.xyz/graphql/
    availability: [BUILD, RUNTIME]
  - variable: MAPBOX_TOKEN
    value: pk.eyJ1Ijoia3dvbmd0biIsImEiOiJjbHd3eDlibHUxMGV0MmxzN2E0eG04MGl0In0.LVf9Nq5laopxg5y4hy8i_w
    availability: [BUILD]
  - variable: ENVIRONMENT_NAME
    value: staging
    availability: [BUILD]
  - variable: UPLOAD_CONCURRENCY
    value: "10"
    availability: [BUILD]
  # Web Push (VAPID) public key for the line alerts (core/push). Generate it in the Firebase
  # console: Project settings > Cloud Messaging > Web Push certificates > Generate key pair, and
  # paste the public key here. It is public (the browser receives it), so a plain value is fine.
  # Empty: the alert bell renders disabled with "Alerts are not set up yet".
  - variable: FCM_VAPID_KEY
    value: "BBQSiMklo3Hj4lUiB3Abc4dPeL6la7Jr7iWqK0hBlQw_7bl8S2bfq73k_3KgUO9pJmPI_qJHPCVCPhBWAFZEAGA"
    availability: [BUILD]
