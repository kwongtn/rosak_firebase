<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TranSPOT</title>
    <meta
      name="description"
      content="Community-run Malaysian public transport spotting, tracking and incident log."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Pre-paint theme init: until Angular hydrates, SSR HTML is light, so a dark-mode user would
       both flash light and (since styles.css keys `color-scheme: dark` off the .dark class — the
       signal the ads loader below reads for dark creatives) get light ads. Mirror ThemeService:
       stored mode "light"|"dark"|"system"; "system" follows the OS. It re-applies on bootstrap. -->
    <script>
      try {
        const theme = localStorage.getItem("theme") || "system";
        if (
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // localStorage unavailable (e.g. private mode): stay light; ThemeService re-resolves anyway.
      }
    </script>
    <!-- Same AdSense client as the old app (ca-pub-3632544969292535, see its own index.html) —
       reused rather than a fresh ID, since this is the same site/publisher account, not a new
       one to provision. Auto ads: Google's own algorithm places ads based on the account's
       dashboard settings, with no manual `<ins class="adsbygoogle">` unit needed on this side —
       unlike the old app, which loaded this same script but never used it for anything else
       either, this is genuinely all a page needs for Auto ads to work (assuming Auto ads is
       enabled for this client ID in the AdSense dashboard, which is an account-level setting
       outside this codebase). A specific manual placement (e.g. one <ins> in the footer) would
       need a real ad-slot ID created in that dashboard first — not something to fabricate here. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3632544969292535"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
