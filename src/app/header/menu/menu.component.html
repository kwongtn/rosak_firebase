<div class="header-menu">
    @for (item of menuList; track item) {
        <div
            class="menu-item"
            (click)="onSelect(item)"
            [ngClass]="{
                'menu-selected-item':
                    item.href.split('/')[1] === router.url.split('/')[1],
            }"
        >
            @if (item.href) {
                <a
                    class="menu-link"
                    [href]="item.href"
                    rel="noopener noreferrer"
                    [routerLink]="item.href"
                >
                    @if (item.tag) {
                        <nz-badge
                            [nzCount]="item.tag"
                            [nzOffset]="[5, -8]"
                            [nzStyle]="{
                                backgroundColor: badgeColor(item.style),
                            }"
                        >
                            {{ item.name }}
                        </nz-badge>
                    } @else {
                        {{ item.name }}
                    }
                </a>
            }
        </div>
    }

    <div class="menu-item">
        <a
            class="menu-link"
            [href]="'https://github.com/kwongtn/rosak_firebase'"
            rel="noopener noreferrer"
            target="_blank"
        >
            <span nz-icon nzType="github" nzTheme="outline"></span>
        </a>
    </div>

    <div class="menu-item">
        <span
            nz-icon
            nzType="bulb"
            class="menu-item-theme"
            (click)="toggleTheme()"
        ></span>
    </div>

    <div
        nz-tooltip
        class="menu-item"
        nzTooltipTitle="Report a bug"
        nzTooltipPlacement="left"
    >
        <span
            nz-icon
            nzType="bug"
            class="menu-link"
            (click)="reportBug()"
        ></span>
    </div>

    @if (countIcon > 0 || hadUpload) {
        <div
            nz-tooltip
            class="menu-item"
            [nzTooltipTitle]="
                countIcon == 0
                    ? 'All uploads complete'
                    : countIcon + ' uploads pending'
            "
            nzTooltipPlacement="left"
        >
            <nz-badge
                nzStandalone
                [nzCount]="
                    countIcon == 0 && hadUpload ? iconTemplate : countIcon
                "
            ></nz-badge>
        </div>
    }
</div>

<ng-template #iconTemplate>
    <span
        nz-icon
        [nzType]="'check-circle'"
        [nzTheme]="'twotone'"
        [nzTwotoneColor]="'#52c41a'"
    ></span>
</ng-template>
