@if (showLoading) {
    <nz-spin class="spinner" nzSimple></nz-spin>
} @else {
    <div>
        <div class="title-container">
            <table>
                <tr>
                    <td>
                        <line-status-tag
                            [lineStatus]="lineStatus"
                        ></line-status-tag>
                    </td>
                    <td>
                        <h1 style="display: inline">
                            {{ title }}
                        </h1>
                    </td>
                </tr>
            </table>
        </div>

        <div class="status-icon-grid">
            <span nz-tooltip nzTooltipTitle="Total" nzTooltipPlacement="bottom">
                <nz-tag [nzColor]="'var(--devui-primary)'">
                    Total: {{ totalCount }}
                </nz-tag>
            </span>

            |

            @for (elem of tagListDisplayConfig; track elem) {
                <span
                    nz-tooltip
                    [nzTooltipTitle]="
                        (((elem.count ?? 0) / totalCount) * 100).toPrecision(
                            3
                        ) + '%'
                    "
                    nzTooltipPlacement="bottom"
                >
                    <nz-tag [nzColor]="elem.color ?? ''" class="status-icon">
                        {{ elem.displayPrefix }}: {{ elem.count ?? 0 }}
                    </nz-tag>
                </span>
            }
        </div>
    </div>
}

@for (elem of tableData; track elem) {
    <div class="spotting-table-elem">
        <app-spotting-table
            class="app-spotting-table"
            [dataSource]="elem"
        ></app-spotting-table>
    </div>
}
