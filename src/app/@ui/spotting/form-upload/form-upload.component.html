@for (file of files | keyvalue; track file) {
    <div
        class="devui-add-images"
        [ngStyle]="{ width: imageWidth, height: imageHeight }"
    >
        <nz-spin
            class="devui-add-items"
            [nzSpinning]="file.value.buffer === null"
        >
            <img
                class="image"
                [src]="file.value.buffer"
                nz-popconfirm
                nzPopconfirmTitle="Are you sure to remove this image?"
                nzPopconfirmPlacement="bottom"
                (nzOnConfirm)="onImageClick(file.key)"
            />
        </nz-spin>
        <span class="filename"> {{ file.value.displayFilename }}</span>
    </div>
}
<nz-upload
    nzType="drag"
    class="devui-add-images devui-upload"
    [ngStyle]="{ width: imageWidth, height: imageHeight }"
    [nzMultiple]="true"
    [nzAccept]="acceptedTypes"
    [nzShowUploadList]="false"
    [nzBeforeUpload]="beforeUpload"
>
    <span class="icon-op-add" nz-icon nzType="plus"></span>
</nz-upload>
